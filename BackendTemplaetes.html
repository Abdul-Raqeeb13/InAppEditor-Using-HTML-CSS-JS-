<div
  style="
    width: 1080px;
    height: 1920px;
    position: relative;
    font-family: 'Manrope', sans-serif;
    overflow: hidden;
  "
>
  <div
    style="
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    "
  >
    <img
      src="{background_image}"
      style="
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: grayscale(100%);
      "
    />
    <div
      style="
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.2);
      "
    ></div>
  </div>

  <div
    style="
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 758px;
      z-index: 1;
      overflow: hidden;
    "
  >
    <svg
      width="1080"
      height="758"
      viewBox="0 0 1080 758"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      style="position: absolute; bottom: 0; left: 0"
    >
      <path
        d="M1080 758H0V0C135.866 129.47 327.563 210.146 540 210.146C752.437 210.146 944.134 129.47 1080 0V758Z"
        fill="{color}"
      />
    </svg>
  </div>

  <div
    style="
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 43.18px;
      font-weight: 500;
      color: #ffffff;
      z-index: 2;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
      font-family: 'Manrope', sans-serif;
    "
  >
    <img
      src="{logo}"
      alt="Logo"
      style="width: 53px; height: 52px; object-fit: cover"
    />
  </div>

  <div
    style="
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 350px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #fff;
      padding: 0 40px;
      box-sizing: border-box;
      z-index: 2;
    "
  >
    <div
      style="
        font-size: 72.48px;
        font-weight: 600;
        line-height: 72.44px;
        letter-spacing: -1px;
        margin-bottom: 20px;
        max-width: 945px;
        position: relative;
        top: -100px;
        font-family: 'Manrope', sans-serif;
      "
    >
      {headline}
    </div>

    <div
      style="
        font-size: 33.34px;
        font-weight: 400;
        color: #ffffff;
        margin-bottom: 50px;
        line-height: 44.98px;
        max-width: 945px;
        position: relative;
        top: -100px;
        font-family: 'Manrope', sans-serif;
      "
    >
      {punchline}
    </div>

    <button
      style="
        background: #fff;
        color: #3259e8;
        border: none;
        padding: 18px 50px;
        border-radius: 60px;
        font-size: 29.02px;
        font-weight: 600;
        cursor: pointer;
        width: auto;
        min-width: 476px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        position: relative;
        top: -100px;
        font-family: 'Manrope', sans-serif;
      "
    >
      {call_to_action}
    </button>
  </div>
</div>
